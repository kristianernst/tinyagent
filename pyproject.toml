[project]
name = "tinyagent"
version = "0.1.0a0"
description = "Minimal general-purpose agent harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tinyagent = "tinyagent.cli:main"
tinyagent-tui = "tinyagent.cli:main_tui"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyagent"]

[tool.hatch.build.targets.wheel.force-include]
"tui/package.json" = "tinyagent/tui/package.json"
"tui/bun.lock" = "tinyagent/tui/bun.lock"
"tui/dist" = "tinyagent/tui/dist"
"tui/src" = "tinyagent/tui/src"
"tui/fixtures" = "tinyagent/tui/fixtures"

[tool.hatch.build.targets.sdist]
exclude = [
    "/tui/node_modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live model endpoint and explicit TINYAGENT_RUN_INTEGRATION=1",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
